version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: school-saas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: school-saas-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
